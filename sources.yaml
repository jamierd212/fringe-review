# Publications the scraper reads.
#
# This is the file you will edit most. Add a publication by giving it a feed and
# saying where the rating lives. Set `enabled: false` (with a note) rather than
# deleting a site, so you don't re-investigate it in six months.
#
# `backfill` is a WordPress trick: most WordPress sites expose a date archive as
# a feed, so /2025/08/feed/ returns August 2025 posts. That is how we test
# against real Fringe data out of season.

defaults:
  # Where corrections go. Shown in the page footer and used as the contact point
  # for publications. A forwarding address on our own domain: it keeps the
  # personal inbox private and does not point readers at the source repository.
  contact_url: "mailto:corrections@fringestars.com"
  contact_label: "email corrections@fringestars.com"

  # The +URL in a User-Agent exists so anyone seeing us in their logs can find
  # out who we are and how to stop us. It points at a page written for exactly
  # that, rather than at a source repository which answers a different question.
  user_agent: "FringeLeaderboardBot/0.1 (+https://fringestars.com/bot.html)"

  # Cloudflare Web Analytics. Paste the token from the snippet Cloudflare shows
  # you (Analytics & Logs -> Web Analytics -> Add a site), NOT the whole tag.
  # Left blank, no script is emitted at all — the site stays script-free apart
  # from the search box, and nothing is loaded from a third party.
  #
  # Chosen over Google Analytics because it sets no cookies and collects no
  # personal data, so it does not drag a consent banner onto a page people are
  # mostly glancing at on a phone.
  analytics_token: "0730ec74a6644f20aeb877089108726f"
  delay_seconds: 1.0        # be polite: max ~1 request per second per site
  timeout_seconds: 25

  # Only reviews published inside this window count as festival reviews.
  # Several sources (One4Review, All Edinburgh Theatre) cover Scottish arts all
  # year, so without this a February folk-club gig lands on the Fringe
  # leaderboard. Deliberately generous at both ends: previews start appearing in
  # late July and stragglers are still posted into September.
  festival_window:
    start: "07-15"          # 15 July
    end: "09-15"            # 15 September

publications:

  # ---------------------------------------------------------------- verified
  - name: All Edinburgh Theatre
    slug: alledinburghtheatre
    homepage: https://www.alledinburghtheatre.com/
    feed: https://www.alledinburghtheatre.com/feed/
    backfill: https://www.alledinburghtheatre.com/{year}/{month:02d}/feed/
    rating:
      type: auto            # ★★★★☆ sits in the feed's content:encoded
    fetch_page: false       # everything we need is already in the feed
    pages: 10               # 10 items per page; 10 pages covers a busy month
    verified: 2026-08-01
    notes: >
      Cleanest source. Stars appear in content:encoded as ★★★★☆ followed by a
      one-word verdict. Covers theatre broadly, plus a Made-in-Edinburgh strand.

  - name: One4Review
    slug: one4review
    homepage: https://www.one4review.co.uk/
    feed: https://www.one4review.co.uk/feed/
    backfill: https://www.one4review.co.uk/{year}/{month:02d}/feed/
    rating:
      type: auto            # rating is in the post TITLE, in inconsistent forms
    fetch_page: false
    pages: 10
    verified: 2026-08-01
    notes: >
      Ratings live in the headline and the format varies review to review:
      "4⭐⭐⭐⭐", "3***", "***** 5 stars". The star/asterisk/word strategies in
      ratings.py all exist because of this site. High volume during the Fringe.

  - name: ThreeWeeks Edinburgh
    slug: threeweeks
    homepage: https://threeweeksedinburgh.com/
    feed: https://threeweeks.co.uk/feed/
    # No date archive: /2025/08/feed/ returns 404. Not needed — the main feed
    # serves ~150 items in one response, which covers a whole festival.
    rating:
      type: auto            # "4/5" in the page text
    fetch_page: true        # rating is on the page, not in the feed
    pages: 1
    title_strip_patterns:
      # Their house style is "<show> (<company>)": "Truthmachine (Counterpilot
      # In Association With Cluster Arts)". Left on, the company is part of the
      # show's name on the board and stops it matching the same show from any
      # other publication.
      #
      # The risk is a show whose real title ends in brackets - "Macbeth (An
      # Undoing)" - which this would shorten. Judged worth it: all 19 cases on
      # the 2026 board were companies, and the alternative is 19 wrong titles.
      - "\\s*\\([^)]*\\)\\s*$"
    verified: 2026-08-01
    # STOPPED WORKING 11 August 2026. Their server accepts the TCP connection
    # and then closes it the moment it has read our TLS ClientHello - every
    # version, every cipher set, with and without ALPN, from three different
    # networks. A browser on the same machine and the same network loads the
    # site normally, so it is neither an outage nor an IP block: something is
    # filtering on the shape of the handshake itself, which is decided before
    # any User-Agent is sent. Left enabled: it costs one failed connection a run
    # and will start working again by itself if they change it back.
    notes: >
      Long-running Fringe publication. Ratings render as plain "4/5" text.

  - name: Fest Magazine
    slug: fest
    homepage: https://www.festmag.com/
    feed: https://www.festmag.com/feed/
    backfill: https://www.festmag.com/{year}/{month:02d}/feed/
    rating:
      type: auto            # ★★★★★ on the review page
    fetch_page: true        # stars are on the page, not in the feed
    require_title_prefix: "Review:"
    pages: 3
    verified: 2026-08-02
    notes: >
      The highest-volume source available: 264 items in August 2025, of which
      227 are reviews, and the whole month arrives in ONE request rather than
      paginated ten at a time.

      require_title_prefix is load-bearing, not tidiness. Fest's round-up posts
      ("The Very Best of the Edinburgh Festivals 2025") repeat the star ratings
      of every show they mention, so the rating cascade scores the round-up
      itself 5 stars and invents a show with that title. Only items titled
      "Review: ..." are real reviews.

  # ------------------------------------------------- national newspapers
  - name: The Guardian
    slug: guardian
    homepage: https://www.theguardian.com/culture/edinburghfestival
    api: guardian            # Open Platform API, not RSS — see collect.py
    tag: culture/edinburghfestival
    feed: https://content.guardianapis.com/search   # documentation only
    api_pages: 20
    verified: 2026-08-02
    notes: >
      Uses the Guardian's Open Platform API rather than their RSS feed, for two
      reasons. Their star ratings render as SVG components with nothing
      scrapable in the HTML, but the API returns starRating as an integer. And
      their RSS is a rolling ~4-month window with no archive, so a 2025
      backfill is impossible from it; the API takes an explicit date range.

      Runs on the Guardian's public "test" key by default, which needs no
      registration but is rate-limited. Set GUARDIAN_API_KEY to a free
      developer key (12,000 calls/day) before relying on it daily.

      Items with no starRating are features and interviews and are skipped
      automatically, so no title filtering is needed.

  # ------------------------------------------- included to exercise conversion
  - name: The Reviews Hub
    slug: reviewshub
    homepage: https://www.thereviewshub.com/
    feed: https://www.thereviewshub.com/feed/
    backfill: https://www.thereviewshub.com/{year}/{month:02d}/feed/
    rating:
      type: css
      selector: "span.number.rating .value"
      scale: 100           # they publish a percentage, e.g. 80%
    fetch_page: true
    require_edinburgh: true   # their feed is UK-wide; filter to Edinburgh shows
    pages: 3
    verified: 2026-08-01
    notes: >
      Rates out of 100 (shown as a percentage and as a /10 figure), which means
      odd values land on half-stars: 90% is 4.5 stars. Those get rounded DOWN to
      4 and flagged on the site, so we never invent a five-star review. High
      volume but only about a third of its output is Edinburgh during August.

  - name: FringeReview
    slug: fringereview
    homepage: https://fringereview.co.uk/
    # Their site-wide feed is mostly interviews and other festivals (Brighton,
    # Colchester, Durham). This Edinburgh-only feed is the one you want.
    feed: https://fringereview.co.uk/festival/edinburgh-fringe/feed/
    rating:
      type: badge
      vocabulary: fringereview
    fetch_page: true        # the badge is on the page, not in the feed
    festival_feed: true     # feed is Edinburgh-only, so no date window applies
    pages: 2
    verified: 2026-08-01
    notes: >
      Awards named badges rather than stars, encoded in an image filename
      (HIGHLY_RECOMMENDED_SHOW.png). Mapped to stars in ratings.py: Outstanding
      / Must See / Excellent = 5, Highly Recommended / Very Good = 4,
      Recommended / Good = 3. Daring, Exciting, Groundbreaking and Hidden Gem
      are skipped — they describe the kind of work, not its quality.

      TWO CAVEATS. FringeReview explicitly rejects a strict hierarchy between
      its ratings, so the numbers are our editorial call, not theirs — the badge
      name is always displayed alongside the stars. And they only publish shows
      rated "Good" or better, so this source can lift a show up the leaderboard
      but can never pull one down.

  # ------------------------------------------------------ deliberately excluded

  - name: The Student
    slug: thestudent
    homepage: https://www.thestudentnews.co.uk/
    feed: https://www.thestudentnews.co.uk/feed/
    pages: 5
    rating:
      type: auto
    fetch_page: true
    require_title_prefix: "Fringe 2026:"
    title_strip_patterns:
      - '^\s*Fringe \d{4}:\s*'
    verified: 2026-08-15
    notes: >
      Edinburgh University's student paper, and prolific during the festival —
      every one of the ten most recent feed items was a Fringe review. Their
      house prefix is "Fringe <year>:", so THE PREFIX NEEDS UPDATING each August.

  - name: A Young(ish) Perspective
    slug: ayoungishperspective
    homepage: https://ayoungishperspective.co.uk/
    feed: https://ayoungishperspective.co.uk/feed/
    pages: 5
    rating:
      type: auto              # star characters in the page
    fetch_page: true
    require_title_prefix: "REVIEW:"
    title_strip_patterns:
      - '^\s*REVIEW:\s*'
      - '\s+@\s+.*$'          # "@ Cabaret Voltaire", their venue notation
    verified: 2026-08-15
    notes: >
      They review year-round and turn to Edinburgh in August, so most of the feed
      is out of scope and the festival window does the filtering.

  - name: Bouquets & Brickbats
    slug: bouquetsbrickbats
    homepage: https://bouquetsbrickbatsreviews.com/
    feed: https://bouquetsbrickbatsreviews.com/feed/
    pages: 5
    rating:
      type: auto              # written as "N stars" in the copy
    fetch_page: true
    verified: 2026-08-15
    notes: >
      Feed titles are the show name alone, with no prefix or venue to strip.

  - name: The QR
    slug: theqr
    homepage: https://theqr.co.uk/
    feed: https://theqr.co.uk/feed/
    pages: 5
    rating:
      type: auto
    fetch_page: true
    require_title_prefix: "EdFringe Review:"
    title_strip_patterns:
      - '^\s*EdFringe Review:\s*'
      - '\s+[–—-]\s+.*$'      # trailing subtitle after a dash
    verified: 2026-08-15
    notes: >
      Sampled eight reviews: six fours, a three and one unrated, so the rating
      moves rather than being a constant read off the page furniture.

  - name: Edinburgh Reviews
    slug: edinburghreviews
    homepage: https://edinburgh-reviews.co.uk/
    feed: https://edinburgh-reviews.co.uk/feed/
    pages: 5
    rating:
      type: auto              # schema.org rating on the page
    fetch_page: true
    require_title_match: "\\breview\\b"
    verified: 2026-08-15
    notes: >
      Despite the name they cover restaurants, exhibitions and anime alongside
      the festival, so the admission gate does the real filtering here.

  - name: The Herald
    slug: heraldscotland
    homepage: https://www.heraldscotland.com/
    # No feed reaches their festival coverage, and their sitemap is sections
    # only. The festivals topic page lists the reviews as they are published.
    discovery: index
    index_urls:
      - https://www.heraldscotland.com/topics/edinburgh-festivals-2026/
    link_pattern: 'href="(/[^"]*fringe-review[^"]*)"[^>]*>(.*?)</a>'
    rating:
      # Stated in the page title: "Fringe review: 44 Minutes, Assembly Rooms,
      # four stars". Anchored to the title because the phrase appears about
      # thirty times elsewhere on the page, in the headlines of every other
      # review they link to.
      type: pattern
      pattern: '<title>[^<]*?\b(one|two|three|four|five|[1-5])\s+stars?\b'
      scale: 5
    fetch_page: true
    title_from_page: true
    # og:title holds a promotional standfirst, not the show; <title> has the
    # show, the venue and the rating in their house format.
    title_pattern: '<title>([^<]*)</title>'
    title_strip_patterns:
      - '\s*\|\s*The Herald\s*$'
      - '^\s*Fringe review:\s*'
      - ',\s*[^,]*\bstars?\b.*$'     # the rating, which ends their headline
      - ',\s*[^,]+$'                  # then the venue
    verified: 2026-08-15
    notes: >
      THE TOPIC URL CARRIES THE YEAR and will need a new entry each August,
      like Chortle's index. Without it this source silently collects nothing.
    #
    # The rating is also in the URL slug (…-four-stars/), which is a useful
    # cross-check if the title format ever changes.

  - name: Theatre & Tonic
    slug: theatreandtonic
    homepage: https://www.theatreandtonic.co.uk/
    # No feed; they keep a dedicated Edinburgh section that lists the lot.
    discovery: index
    index_urls:
      - https://www.theatreandtonic.co.uk/edinburgh-fringe
    link_pattern: 'href="(/edinburgh-fringe/[a-z0-9-]{8,})"[^>]*>(.*?)</a>'
    rating:
      type: auto              # star characters in the page
    fetch_page: true
    title_from_page: true
    title_strip_patterns:
      # Their page titles run "<show> at <venue> Review — Theatre and Tonic".
      # The venue is the part that stops a match: only one review in seventeen
      # landed on a show until it came off.
      - '\s+at\s+.*$'
    verified: 2026-08-15
    notes: >
      Not every piece in the section is a rated review — previews and interviews
      sit alongside them and are skipped for want of a rating.

  - name: West End Best Friend
    slug: westendbestfriend
    homepage: https://westendbestfriend.co.uk/
    # Their feed 404s; the sitemap is current and holds every review.
    discovery: sitemap
    sitemap: https://westendbestfriend.co.uk/sitemap.xml
    url_must_match:
      - 'fringe-review'
    rating:
      type: auto              # written as "N stars" in the copy
    fetch_page: true
    title_from_page: true
    title_strip_patterns:
      - '^\s*Fringe Review:\s*'
      - ',\s*[^,]+$'          # trailing venue, as in "PENELOPE, Belly Button"
    verified: 2026-08-15
    notes: >
      They title every festival piece "Fringe Review: <SHOW>, <venue> at <venue>",
      so the URL filter keeps their year-round West End coverage out.

  - name: Edinburgh Festivals Magazine
    slug: edfestmag
    homepage: https://edfestmag.com/
    feed: https://edfestmag.com/feed/
    pages: 4
    rating:
      # Their rating is a line of prose after the credits: "Words: Trudy Lynn
      # Image: Aloft Circus Arts 4 stars". Anchored to "Words:" because every
      # page also carries a testimonial reading "Rated 4 out of 5" — identical on
      # all of them — which the ordinary cascade picks up first and which would
      # have published every review as four stars, including the threes and
      # fives.
      type: pattern
      pattern: 'Words:[^<]{0,140}?\b([1-5])\s*stars?\b'
      scale: 5
    fetch_page: true
    verified: 2026-08-15
    notes: >
      robots.txt is "Disallow:" with nothing after it. Feed titles are the show
      name as the Fringe writes it, which is unusually clean. Not every article
      is a rated review; the ones without a rating are skipped.

  - name: Entertainment Now
    slug: entertainmentnow
    homepage: https://entertainment-now.com/
    feed: https://entertainment-now.com/feed/
    pages: 5
    rating:
      # Their rating is a graphic, and the graphic is not called a star. The file
      # is Twinkle-4.png, so every search for "star" in a filename, an alt text
      # or the copy came back empty and the site was written off twice as a
      # publication that does not rate anything. It rates everything.
      type: pattern
      pattern: '/Twinkle-([1-5])(?:-\d+x\d+)?\.png'
      scale: 5
    fetch_page: true
    require_title_match: '\bReview\b'
    title_strip_patterns:
      - '^\s*Edfringe\s+(?:Comedy|Theatre|Music|Dance)?\s*Review:\s*'
      - '^\s*Review:\s*'
    verified: 2026-08-22
    notes: >
      robots.txt is "Disallow:" with nothing after it. The feed carries ten
      items, so the archive needs the index for a real backfill. Kate Copstick's
      "Fringe Gems" pieces are not rated and are skipped.

  - name: Edinburgh Guide
    slug: edinburghguide
    homepage: https://edinburghguide.com/
    feed: https://edinburghguide.com/rss.xml
    pages: 5
    rating:
      # Drupal states it outright in a labelled field: "Rating (out of 5) 4".
      # The generic reader finds nothing there — its "N out of M" pattern wants
      # the number first, and here the number comes after the label, so twenty of
      # their reviews read as unrated and were left out.
      type: css
      selector: ".field--name-field-rating .field__item"
      scale: 5
    fetch_page: true
    require_title_match: "[Rr]eview"
    title_strip_patterns:
      - ',\s*[^,]*Review\s*$'
      - ',\s*[^,]+$'          # trailing venue
    verified: 2026-08-29
    notes: >
      Reviews the festivals alongside general Edinburgh coverage, so the title
      filter does the work. The rating field is absent on previews and features,
      which are skipped as unrated.

  - name: RGM
    slug: rgm
    homepage: https://rgm.press/
    # Their feed is music-led and carries none of this; the Edinburgh tag page
    # lists every festival round-up they publish.
    discovery: index
    index_urls:
      - https://rgm.press/tag/edinburgh-fringe/
    link_pattern: 'href="(https://rgm\.press/edinburgh-fringe[^"]*)"[^>]*>(.*?)</a>'
    rating:
      type: auto
    fetch_page: true
    # Everything they publish about the Fringe is a round-up of several shows,
    # titled "top picks" rather than "reviews", so the default pattern misses
    # them and each article would be filed as a single review of five shows.
    roundups: true
    roundup_pattern: 'top picks|picks of the day|reviews'
    verified: 2026-08-14
    notes: >
      Each show in a round-up is named in a bold line, reviewed in prose, and
      then rated in a paragraph of its own further down — a different shape from
      the round-ups where the rating sits beside the name, and one split_roundup
      now handles.

  - name: The Arts Desk
    slug: theartsdesk
    homepage: https://theartsdesk.com/
    # Their RSS is abandoned — nothing in it is newer than December 2025, and the
    # Edinburgh entries in it are navigation links dated last September. The
    # site itself is current; /reviews lists everything as it is published.
    discovery: index
    index_urls:
      - https://theartsdesk.com/topics/edinburgh-festival
      - https://theartsdesk.com/reviews
    link_pattern: 'href="(/(?:theatre|comedy|dance|opera|classical-music|new-music)/[a-z0-9-]{12,})"[^>]*>(.*?)</a>'
    rating:
      # Drupal's fivestar widget: five divs whatever the rating, each holding a
      # span that is "on" or "off". Their festival round-ups leave the widget
      # unset, so every span reads "off", the count comes to zero and the article
      # is skipped — which is right, because a round-up's ratings belong to the
      # shows inside it and are not stated here.
      type: marker_count
      scope: '<div class="fivestar-widget-static[^"]*">(.*?)</div>\s*</div>'
      marker: '<span class="on">'
    fetch_page: true
    title_from_page: true
    date_from_page: '(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4})'
    date_format: '%d %B %Y'
    # They review the whole of the arts, all year: an unrestricted run collected
    # 29 reviews of which 26 were the Barbican, Dublin and Kilkenny. None could
    # match a Fringe show, so none did any harm, but none should have been asked
    # for either.
    require_title_match: "edinburgh|fringe"
    verified: 2026-08-14
    notes: >
      Their festival ROUND-UPS carry no rating — the widget is left unset, every
      star reads "off", and they are skipped. That is most of their Fringe
      coverage, so expect a handful of reviews rather than a stream: the ones
      that count are the single-show reviews and the EIF concerts.

  - name: Time Out
    slug: timeout
    homepage: https://www.timeout.com/
    discovery: index
    index_urls:
      - https://www.timeout.com/edinburgh/theatre/edinburgh-fringe-international-festival-reviews
    link_pattern: 'href="(/edinburgh/(?:theatre|comedy)/[a-z0-9-]{12,})"[^>]*>(.*?)</a>'
    rating:
      # Their stars are five identical inline SVGs, filled by CSS, so counting
      # them gives five every time. The rating is in the label beside them, put
      # there for screen readers, which is the only place on the page it is
      # written down.
      type: pattern
      pattern: 'class="sr-only">(\d)(?:\.\d)? out of 5 stars'
      scale: 5
    fetch_page: true
    title_from_page: true
    delay_seconds: 10
    verified: 2026-08-14
    notes: >
      Not every Time Out review carries a rating; the ones that do not are
      skipped, as anywhere else.

      THEY 404 UNDER LOAD. Requesting several pages back to back had them
      answering 404 to URLs that had worked moments before, and the error page
      carries star markup of its own — 5 and 4 — which would be collected as a
      rating if it were ever mistaken for an article. Ten seconds between
      requests keeps them answering normally.

  - name: British Theatre Guide
    slug: britishtheatreguide
    homepage: https://britishtheatreguide.info/
    feed: https://britishtheatreguide.info/reviews.atom
    pages: 3
    rating:
      # Font Awesome icons, one per star, with no empty or half variants drawn —
      # a four-star review renders four and stops. Scoped to the rating span,
      # though nothing else on the page uses the icon today.
      type: marker_count
      scope: '<span class="rating">(.*?)</span>'
      marker: 'fa-solid fa-star'
    fetch_page: true
    verified: 2026-08-14
    notes: >
      Feed titles are the show name alone, which is unusually clean. The feed
      covers all their reviews, so the festival window does the filtering.

  - name: Theatre Weekly
    slug: theatreweekly
    homepage: https://theatreweekly.com/
    feed: https://theatreweekly.com/feed/
    pages: 4
    rating:
      # The rating is the filename of a star graphic: New-4Star-350x71.png. The
      # alt text says "Four Star Review" but only on some of them, so the
      # filename is the reliable half.
      type: pattern
      pattern: '/wp-content/uploads/[^"?]*?(\d)Star[^"?]*\.png'
      scale: 5
    fetch_page: true
    require_title_prefix: "Edinburgh Fringe Review:"
    title_strip_patterns:
      - '^\s*Edinburgh Fringe Review:\s*'
      - '\s+at\s+[^,]+$'      # " at theSpace (Triplex BIG)"
    verified: 2026-08-14
    notes: >
      They cover UK theatre year-round and title their festival pieces
      "Edinburgh Fringe Review: <show> at <venue>", so the prefix filter keeps
      the rest of their output out.

  - name: The Stage
    slug: thestage
    homepage: https://www.thestage.co.uk/
    # No feed of any kind; their reviews index is the way in and is updated as
    # reviews are published.
    discovery: index
    index_urls:
      - https://www.thestage.co.uk/reviews/
    # Their hrefs are HTML-encoded (&#x2f; for /), so the pattern matches the
    # slug rather than a path, and discovery makes it absolute.
    link_pattern: 'reviews&#x2f;([a-z0-9-]{12,})"[^>]*>(.*?)</a>'
    rating:
      # Five images, one per star, the empty ones served as stageNoStar.svg.
      # Scoped to the block under the headline: the same markup appears beside
      # every related review in the sidebar, and counting the whole page picks up
      # whichever came last.
      type: marker_count
      scope: '<h1[^>]*>.*?</h1>\s*<div class="aos-StarRating[^"]*">(.*?)</div>'
      marker: 'stageStar\.svg'
    fetch_page: true
    date_from_page: 'class="[^"]*ArticleDate[^"]*"[^>]*>([^<]+)<'
    date_format: '%b %d, %Y'
    delay_seconds: 10          # what their robots.txt asks of search engines
    # The index links each review twice, once by headline and once by a pull
    # quote, so the link text is as likely to be "Fantastically physical
    # performances" as the show's name. The page states it properly.
    title_from_page: true
    # Their page title is "<show> review at <venue>, Edinburgh: <verdict>".
    # The central REVIEW_TAIL rule removes everything from " review" onwards.
    verified: 2026-08-14
    notes: >
      robots.txt allows us and asks 10 seconds between requests, which we honour.
      The rating is readable without a subscription even where the article body
      is not.

  - name: Everything Theatre
    slug: everythingtheatre
    homepage: https://everything-theatre.co.uk/
    feed: https://everything-theatre.co.uk/feed/
    pages: 4
    rating:
      type: auto              # schema.org Review with a ratingValue on the page
    fetch_page: true
    require_title_match: "\\bReview\\b"
    title_strip_patterns:
      - '^\s*Review:\s*'
      - ',\s*[^,]+$'          # trailing venue, as in "Show, The Courtyard Theatre"
    verified: 2026-08-14
    notes: >
      A London-focused site that covers Edinburgh through August, so most of the
      feed is out of scope and the festival window does the filtering.

  - name: EdFringeReview
    slug: edfringereview
    homepage: https://www.edfringereview.com/
    api: firestore
    api_base: https://firestore.googleapis.com/v1/projects/efr-app-ajk/databases/(default)/documents
    public_base: https://www.edfringereview.com/review/r
    feed: https://firestore.googleapis.com/v1/projects/efr-app-ajk/databases/(default)/documents/reviews
    pages: 3                  # 300 a page, ordered newest first
    rating:
      type: none              # stated in the document; never inferred from a page
    verified: 2026-08-14
    notes: >
      Their site renders nothing server-side — every review page is the same
      3.8KB shell — so there is nothing to scrape. The reviews are in a public
      Firestore database that answers unauthenticated reads: no key and no
      credentials, exactly the request a reader's browser makes.

      edfringereview.com/robots.txt is "Disallow:" with nothing after it.

      ONLY APPROVED REVIEWS ARE TAKEN. Their app queries
      where("status","==","APPROVED"); a separate getUnapprovedReviews is the
      editors' moderation queue. Collecting those would put ratings on the board
      that the publication has not published.

  - name: BroadwayWorld
    slug: broadwayworld
    homepage: https://www.broadwayworld.com/
    # No feed covers their Edinburgh coverage — the UK regional RSS carries two
    # items — but the Scotland section lists every festival review as it lands.
    discovery: index
    index_urls:
      - https://www.broadwayworld.com/scotland/
    # Year-agnostic on purpose: the date filter decides which festival a review
    # belongs to, so nothing here needs editing each August.
    link_pattern: 'href="(/[^"]*article/EDINBURGH-\d{4}-Review-[^"]*)"[^>]*>(.*?)</a>'
    rating:
      # The rating is stated nowhere in their text and their structured data
      # marks each piece a CriticReview with no rating in it. It is in the
      # filename of an image: cloudimages.broadwayworld.com/4stars.png.
      type: pattern
      pattern: 'cloudimages\.broadwayworld\.com/(\d)(andahalf)?stars?\.png'
      scale: 5
    fetch_page: true
    # Link text is often empty (the thumbnail anchor), and the headline on the
    # page is the fuller "EDINBURGH 2026: Review: SHOW, Venue".
    title_from_page: true
    title_strip_patterns:
      - '^\s*EDINBURGH\s+\d{4}\s*:?\s*Review\s*:?\s*'
      - ',\s*[^,]+$'          # trailing venue, as with their house style
    verified: 2026-08-14
    notes: >
      robots.txt allows everything except admin paths. Reviews appear under
      /scotland/, /westend/ and /uk-regional/ but all are listed on the Scotland
      section page, which is the single cheapest entry point.

  - name: Broadway Baby
    slug: broadwaybaby
    homepage: https://broadwaybaby.com/
    # No feed of any kind, and pagination is ignored on every listing — /reviews
    # returns the same 517 items whatever ?page= says. Their EdFringe section is
    # the right entry point: Edinburgh only, and refreshed as reviews appear.
    discovery: index
    index_urls:
      - https://broadwaybaby.com/edfringe
    # Their robots.txt asks Google, Bing and Apple for 10 seconds between
    # requests. No rule names us, so nothing obliges us to it, which is exactly
    # why we should: a source with no feed and no sitemap costs a page fetch per
    # review, and asking for fifty of those faster than they let a search engine
    # crawl is not a reasonable way to treat a small publication.
    delay_seconds: 10
    link_pattern: 'href="(https://broadwaybaby\.com/shows/[^"]+/\d+)"[^>]*>(.*?)</a>'
    rating:
      type: css
      selector: "i.fa-star + span"   # <i class="fa-solid fa-star"></i><span>4</span>
      scale: 5
    fetch_page: true
    # The link text is the review's pull-quote ("See it for the central
    # relationship, leave with a sweet melancholy..."), not the show. The page
    # names the show in og:title, prefixed with the publication.
    title_from_page: true
    title_strip_patterns:
      - "^\\s*Broadway Baby\\s*:\\s*"
    # Listing cards show "3 hours ago" or nothing at all, so the date has to come
    # off the review page, which states it outright.
    date_from_page: "Published:\\s*(\\d{1,2} [A-Za-z]{3} \\d{4})"
    date_format: "%d %b %Y"
    verified: 2026-08-05
    notes: >
      One of the highest-volume Fringe reviewers, and previously recorded as
      blocked. It is not: it serves us 200 and its robots.txt has no Disallow
      rules at all.

      The rating defeated three earlier attempts because it is neither a glyph
      nor an image nor schema markup — it is a Font Awesome icon followed by a
      bare number, <i class="fa-solid fa-star"></i><span>4</span>. Searching for
      stars found only Tailwind's "text-start" classes.

      Their /reviews listing is UK-wide (Frinton, Brighton, the West End), which
      is why the EdFringe section is used instead.

  - name: The Scotsman
    slug: scotsman
    homepage: https://www.scotsman.com/
    # Their RSS, not their sitemap. Cloudflare now answers the sitemap and every
    # HTML page with a challenge while leaving robots.txt and the feeds open, so
    # the sitemap route stopped working on 8 August. The feed also lists MORE
    # reviews than the month sitemap did - 11 against 7 - and costs one request
    # instead of a 2.7MB download.
    feed: https://www.scotsman.com/arts-and-culture/edinburgh-festivals/rss
    pages: 1
    rating:
      type: auto              # star characters on the page
    fetch_page: true
    title_from_page: true
    # The feed IS their Edinburgh festivals section, so every item in it is
    # Edinburgh by definition. Requiring a marker in the headline threw away 20
    # of 23 items, because they write "Fringe theatre reviews" and bare "Fringe"
    # is not a marker - it cannot be, or Camden and Brighton would qualify.
    festival_feed: true
    require_title_match: "\\breviews?\\b"   # excludes their daily festivals diary
    roundups: true            # most of their festival output is multi-show
    # They challenge at one request a second. Three seconds is slower than we
    # need for a feed of 23 items and may keep us under whatever trips it.
    delay_seconds: 3
    verified: 2026-08-11
    notes: >
      Their coverage is worth the trouble: 245 reviews in 2025, most of them
      inside round-ups that carry a separate rating per show.

      ACCESS IS INTERMITTENT. Cloudflare bot management, not an editorial
      decision - it 403s a plain curl with no custom user-agent just as readily
      as it 403s us, so this is about the network rather than about who we say
      we are. robots.txt and the RSS feeds stay open throughout; it is the HTML
      pages that carry the rating, and those are what get challenged.

      If the feed keeps finding reviews we cannot then read, the answer is to
      ask them to allowlist us rather than to try anything cleverer.

  - name: The Telegraph
    slug: telegraph
    homepage: https://www.telegraph.co.uk/theatre/
    feed: https://www.telegraph.co.uk/theatre/rss.xml
    rating:
      type: css
      selector: ".e-rating__star--active"
    enabled: false
    verified: 2026-08-02
    notes: >
      NOT WORTH IT: pages are fetchable and the star markup is countable
      (.e-rating__star--active), but the theatre feed carries almost no Fringe
      content — 7 of 102 items mentioned Edinburgh and those were listicles from
      2021-2023, not reviews. Content is also paywalled. Revisit if they publish
      a dedicated Edinburgh feed during the festival.

  - name: Chortle
    slug: chortle
    homepage: https://www.chortle.co.uk/
    # No usable feed — the declared RSS is a three-item news feed. Chortle
    # instead publishes every festival review on one index page, which is
    # updated as reviews appear, so re-fetching it daily picks up what is new.
    discovery: index
    index_urls:
      - https://www.chortle.co.uk/about/2025/07/07/58413/edinburgh_fringe_2025_comedy_reviews
    # Each year's index sits at an unguessable numeric id, but the slug is
    # predictable — so rather than needing a hand-added entry every August (and
    # silently collecting nothing if it is forgotten), look for the link.
    index_discovery:
      slug: "edinburgh_fringe_{year}_comedy_reviews"
      hubs:
        - https://www.chortle.co.uk/
        - https://www.chortle.co.uk/shows/edinburgh_fringe_{year}/
        - https://www.chortle.co.uk/review
    link_pattern: 'href="(https://www\.chortle\.co\.uk/review/\d{4}/\d{2}/\d{2}/\d+/[^"]+)"[^>]*>(.*?)</a>'
    rating:
      type: marker_count
      marker: 'alt="review star"'
    fetch_page: true
    verified: 2026-08-02
    notes: >
      Ratings are drawn as one <img alt="review star"> per star with the empty
      ones omitted, so the rating is simply how many times that marker appears.

      robots.txt permits /review/ and the site serves our User-Agent normally —
      Chortle is not blocking us, it just has no feed.

      The index URL carries an unpredictable numeric id (58413) that cannot be
      derived, so ADD A NEW index_urls ENTRY EACH YEAR. Without the 2026 entry
      this source silently contributes nothing.

      The index also lists non-Edinburgh reviews (Melbourne in April), which the
      date in each review URL filters out.

  - name: The List
    slug: thelist
    homepage: https://www.list.co.uk/
    api: list
    api_base: https://cms.list.co.uk/api/v2
    public_base: https://list.co.uk/news   # article id is appended; without it the page is blank
    feed: https://cms.list.co.uk/api/v2/news   # documentation only; also marks the API host
    pages: 4                  # 20 items a page; four covers a busy festival day
    require_title_match: "\\breview\\b"
    title_strip_patterns:
      # Their headline is "<show> <artform> review: <verdict>", so the artform
      # word sits between the show and the word this pipeline strips from —
      # leaving "All Rise music" and "Sand dance" as show names. Removed here
      # because the list of artforms is this publication's house style, not a
      # general rule.
      - "\\s+(?:music|dance|theatre|comedy|art|books?|opera|circus|cabaret|musicals?|kids|children'?s|spoken\\s+word|film)\\s+review\\b.*$"
    verified: 2026-08-11
    notes: >
      Their site is a Nuxt app that server-renders nothing useful, but the CMS
      API behind it is public and cms.list.co.uk/robots.txt is "Disallow:" with
      nothing after it.

      PREVIOUSLY CLOSED IN ERROR. An earlier look sampled 320 items from the
      /news LIST endpoint, found article_rating null on every one, and concluded
      The List had stopped giving stars. It had not: the field is null on the
      list endpoint and populated only on /news/{id}. They star reviews as they
      always did.

      One request per new review, and none for ones already seen.

      Nothing in the API says which SECTION a piece is in: the microsite
      parameter is ignored, there is no section field, and the festival URL path
      resolves for every article they have ever published — a 2016 nightclub
      listing returns 200 under it. So festival membership cannot be established
      at source. Non-festival content is stopped by the title needing to say
      "review", by the festival date window, and by the admission gate. Worth
      watching in September, when the window closes and their output goes back
      to being city-wide.

  - name: The Wee Review
    slug: weereview
    homepage: https://theweereview.com/
    # Their RSS carries interviews only - every one of the ten most recent items
    # was an /interview/ - so the feed cannot see reviews at all. The homepage
    # lists them and is refreshed as they publish.
    discovery: index
    index_urls:
      - https://theweereview.com/
    link_pattern: 'href="(https://theweereview\.com/review/[^"#?]+)"[^>]*>(.*?)</a>'
    rating:
      type: css
      selector: ".post-img"     # the hero overlay, which holds THIS review's stars
      count_selector: '[class*=fa-star]:not([class*=fa-star-o])'
    fetch_page: true
    title_from_page: true
    title_strip_patterns:
      - "\\s*[–—-]\\s*The Wee Review.*$"    # their og:title appends the masthead
    date_from_page: '<time[^>]+datetime="(\d{4}-\d{2}-\d{2})'
    date_format: "%Y-%m-%d"
    festival_feed: true         # /review/ during the season is festival coverage
    verified: 2026-08-11
    notes: >
      Recorded twice before as "no rating markup found", both times because the
      pages sampled were interviews - which is all their feed contains.

      The stars are Font Awesome icons, not characters: fa-star filled and
      fa-star-o empty. Counting them across the page gives 15, because a review
      page also shows the ratings of two related reviews, so the count is scoped
      to the hero overlay that belongs to the article. Verified across six
      reviews: 4, 4, 3, 4, 4, 4.

  - name: Binge Fringe
    slug: bingefringe
    homepage: https://bingefringe.com/
    feed: https://bingefringe.com/feed/
    backfill: https://bingefringe.com/{year}/{month:02d}/feed/
    rating:
      type: auto            # stars sit in the feed title, e.g. "... EdFringe 2025 ★★★★"
    fetch_page: false
    require_title_prefix: "REVIEW:"
    pages: 6
    title_strip_patterns:
      # Their headline is "REVIEW: <show>, <company>, EdFringe <year> ★★★★".
      # The festival tail is handled centrally; the company is not, and left on
      # it splits the show in two — "Lady Macbeth Played Wing Defence" and
      # "Lady Macbeth Played Wing Defence, Crash Theatre Co and House of Oz"
      # were two entries on the 2025 board. Scoped here because it is this
      # publication's house style, not a general rule.
      # Two patterns, and the order matters. The festival tail has to go first:
      # a single "drop the last comma group" rule removes ", EdFringe 2026" and
      # leaves the company sitting in the show's name.
      - ",\\s*edfringe[^,]*$"
      - ",\\s*[^,]+$"
    verified: 2026-08-03
    notes: >
      Edinburgh-focused and the cleanest source found in the 2026 sweep: 6 of 6
      sampled items carried an extractable rating, and it is in the feed, so no
      page fetch is needed. Titles are "REVIEW: <show>, <company>, EdFringe
      2025 ★★★★", hence the prefix filter.

  - name: Corr Blimey
    slug: corrblimey
    homepage: https://corrblimey.uk/
    feed: https://corrblimey.uk/feed/
    backfill: https://corrblimey.uk/{year}/{month:02d}/feed/
    rating:
      type: auto              # star glyphs on the page (they left the headline in 2026)
    fetch_page: true
    # They moved the word in 2026: "Review:" used to start the headline and now
    # sits mid-string, after the festival name. A prefix test silently dropped
    # every one of their reviews, so this matches wherever it appears.
    require_title_match: "\\bReview:"
    title_strip_patterns:
      # Headlines end "<show> - <venue>", and without removing the venue the
      # dash split made the VENUE the show: "Next To Normal - Sanctuary,
      # Paradise in Augustine's" was filed as a show called "Sanctuary".
      - "\\s+[–—]\\s+[^–—]+$"
    pages: 6
    verified: 2026-08-11
    notes: >
      Two things changed for 2026 and each broke collection silently.

      The rating left the headline. In 2025 it was "Review: ... ★★★★" and could
      be read from the feed alone; now the feed carries no stars at all and they
      are on the page, so fetch_page is on.

      And "Review:" moved from the start of the headline to the middle, after
      the festival name, which a prefix test rejected outright — 59 of 60 items
      dropped before anything looked at them.

  - name: North West End
    slug: northwestend
    homepage: https://northwestend.com/
    feed: https://northwestend.com/feed/
    backfill: https://northwestend.com/{year}/{month:02d}/feed/
    rating:
      type: auto            # "4 out of 5" style, on the page not in the feed
    fetch_page: true
    require_edinburgh: true
    pages: 8
    verified: 2026-08-03
    notes: >
      UK-wide: the August 2025 sample was largely Southwark Playhouse and other
      London venues, so require_edinburgh is doing real work here rather than
      being a precaution. 4 of 6 sampled items rated.

  - name: Musical Theatre Review
    slug: musicaltheatrereview
    homepage: https://musicaltheatrereview.com/
    feed: https://musicaltheatrereview.com/feed/
    backfill: https://musicaltheatrereview.com/{year}/{month:02d}/feed/
    rating:
      type: auto
    fetch_page: false
    require_edinburgh: true
    pages: 6
    exclude_title_patterns:
      - "\\b(wins|won|receives|awarded|announces)\\b"
    title_strip_patterns:
      # Every headline ends "<show> - Edinburgh Festival Fringe". Left on, that
      # suffix is most of the string, so the fuzzy matcher scored two unrelated
      # shows as near-identical and filed them together: on the 2025 board TWENTY
      # separate musicals became one entry called "Edinburgh Festival Fringe",
      # which ranked first with 20 reviews. "Badgers" landed on "Little Pink
      # Dress" in 2026 the same way.
      - "\\s*[-\u2013\u2014]\\s*Edinburgh [Ff]estival [Ff]ringe\\s*$"
    enabled: false
    verified: 2026-08-11
    notes: >
      NEWLY BLOCKED. Contributed 7 reviews to the 2026 board and then started
      answering HTTP 401 with a "Security Verification" interstitial on every
      path, robots.txt included — the same shape of block as Voice Magazine.
      Nothing to work around: ask, or leave it.

      Everything below was working until then. Word grades in the feed, UK-wide
      so require_edinburgh applies, and award announcements are excluded because
      "Hot Mess wins Best Musical Award" scored five stars against the real show.

  - name: Voice Magazine
    slug: voicemag
    homepage: https://www.voicemag.uk/
    feed: https://www.voicemag.uk/feed
    rating:
      type: auto
    enabled: false
    verified: 2026-08-03
    notes: >
      BLOCKED, and the only one of the three that genuinely is. Cloudflare
      returns 403 with "Cf-Mitigated: challenge" on every path including
      robots.txt, so we cannot even read their crawling rules. Getting past a
      challenge means defeating a bot check - that is, presenting ourselves as
      something we are not - which is different in kind from reading a robots
      rule that already permits us. Ask; do not work around.

      A young people's arts magazine with substantial Fringe coverage.

  - name: Reviews Gate
    slug: reviewsgate
    homepage: https://reviewsgate.com/
    feed: https://reviewsgate.com/feed/
    rating:
      type: auto
    enabled: false
    verified: 2026-08-03
    notes: >
      EXCLUDED: the feed now carries SEO spam ("Costa Rica Crypto Business Setup
      Lawyers") alongside theatre content, which suggests the site is
      compromised or sold on. Not a source to rely on.

  - name: Grapevine Magazine
    slug: grapevine
    homepage: https://www.thegrapevinemag.com/
    # Squarespace: no /feed, but their section feeds work. Theatre is the only
    # section carrying Fringe reviews.
    feed: https://www.thegrapevinemag.com/theatre?format=rss
    rating:
      type: auto              # star characters in the feed body
    fetch_page: false
    pages: 1                  # the section feed is not paginated
    require_edinburgh: false  # a Fringe-focused theatre section
    verified: 2026-08-11
    notes: >
      Came to us from a reader pointing at a review we had missed, which is how
      it was found rather than by probing.

      robots.txt names 29 AI crawlers including ClaudeBot and anthropic-ai, but
      User-agent: * disallows only /config, /search, /account, /api and /static.
      Same position the owner took on the other sites doing this: those rules
      target training crawlers, and we are a link aggregator.

      6 of 8 sampled items rated, from the feed alone. The two misses were an
      opinion piece and a round-up, both correctly unrated.

  - name: The Skinny
    slug: theskinny
    homepage: https://www.theskinny.co.uk/
    # No feed of any kind, and the sitemap ignores its own ?page= parameter —
    # every page returns the same 500 articles from 2015 — so the paginated
    # section listings are the only route in. They are a good one: link, title
    # and date all come from a single request.
    discovery: listing
    listing_urls:
      - https://www.theskinny.co.uk/festivals/edinburgh-fringe/theatre?page={page}
      - https://www.theskinny.co.uk/festivals/edinburgh-fringe/comedy?page={page}
      - https://www.theskinny.co.uk/festivals/edinburgh-fringe/cabaret?page={page}
    link_match: "/festivals/edinburgh-fringe/"
    pages: 3                  # a daily run only needs the newest; raise to backfill
    rating:
      type: css
      selector: ".star-rating"
      count_stars: true       # <div class="star-rating"><span>&#x2605;</span>...
    fetch_page: true
    title_from_page: true     # card text prepends the section ("Theatre ...")
    title_strip_patterns:
      - ":?\\s*Edinburgh (Fringe|Festival)[^:]*review\\b.*$"
      - "\\s*[-–]\\s*The Skinny\\s*$"
    festival_feed: true       # the sections are Edinburgh Fringe by definition
    verified: 2026-08-03
    notes: >
      Major Scottish arts publication with heavy Fringe coverage. robots.txt
      allows everything bar /admin, /api and one numeric path.

      The rating is entity-encoded star glyphs inside a div, which no text scan
      of the HTML can see — hence the count_stars mode, which parses the element
      and counts what is inside it. Verified on ten real 2025 reviews: 8 rated,
      and both misses were "The Besties 2025" award posts rather than reviews.

      Only theatre, comedy and cabaret exist as Fringe sections; music, dance,
      art and books all 404. Dates come from the listing card because the
      article pages carry no published-time metadata at all — and without a date
      page five of a section, which is last year's festival, would be filed
      under the current year.
