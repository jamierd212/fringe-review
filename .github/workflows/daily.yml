name: Daily review sweep

on:
  schedule:
    # 07:00 UTC = 08:00 BST. GitHub cron is UTC only, so change this to
    # "0 8 * * *" if you ever want 08:00 during British WINTER time.
    # Scheduled runs sit in a queue and can start 5-20 minutes late — and
    # occasionally far later: 3 August 2026 was delivered nine hours behind.
    - cron: '0 7 * * *'

  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill one month, as YYYY-MM (e.g. 2025-08). Leave blank for a normal daily run.'
        required: false
        type: string
      limit:
        description: 'Stop after N candidates per publication. Use to rehearse a backfill cheaply.'
        required: false
        type: string

# Needed so the job can commit the updated database back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # A daily run takes a few minutes. A month backfill is a different job: it
    # fetches a page per review at one request a second, and every show it finds
    # is new, so each one needs an admission decision. 30 minutes is not enough
    # for that, and a backfill killed halfway leaves the database half-written.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # One second, and it would have saved a day's board: Pillow was added to
      # a local virtualenv and not to requirements, so the sweep imported
      # run.py on a clean checkout and died before it fetched anything.
      - name: Check requirements cover the imports
        run: python tools/check_requirements.py

      - name: Collect, match and render
        env:
          # Used for ambiguous show matches and for admitting shows that are not
          # in any festival programme. Without it only programme-listed shows can
          # be admitted and everything else is held — which is the safe direction,
          # but on a backfill of a past festival it means almost everything, since
          # programme pages come down once the shows stop selling.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Guardian Open Platform. Without it the code falls back to their
          # public "test" key, which works but is rate-limited and will start
          # dropping requests once the festival is busy.
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          # Passed as environment rather than interpolated into the command, so
          # the value is data and cannot become part of the shell line.
          BACKFILL: ${{ inputs.backfill }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${BACKFILL:-}" ]; then
            if ! printf '%s' "$BACKFILL" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
              echo "backfill must look like YYYY-MM (got '$BACKFILL')" >&2
              exit 1
            fi
            args+=(--backfill "$BACKFILL")
          fi
          if [ -n "${LIMIT:-}" ]; then
            if ! printf '%s' "$LIMIT" | grep -Eq '^[0-9]+$'; then
              echo "limit must be a whole number (got '$LIMIT')" >&2
              exit 1
            fi
            args+=(--limit "$LIMIT")
          fi
          # ${args[@]+"${args[@]}"} is the portable empty-array idiom: nothing
          # when there are no arguments, the quoted elements when there are.
          # "${args[@]:-}" would expand to one EMPTY argument on a normal daily
          # run, and argparse rejects that outright; a bare "${args[@]}" is only
          # safe under `set -u` on bash 4.4+, which is not worth depending on.
          echo "Running: python run.py ${args[*]+${args[*]}}"
          python run.py ${args[@]+"${args[@]}"}

      # Runs before the commit so that what it records - which links have been
      # checked, and when - is committed with the day's reviews. Otherwise the
      # rotation resets every night and the same two links get checked forever.
      # The exit code is carried past the commit rather than acted on here.
      - name: Check sources and links
        id: health
        run: |
          set +e
          python run.py --health
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit the day's results
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          git config user.name  "fringe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.db docs/ review_queue.md
          # "git commit" fails when nothing changed, which is a normal quiet day,
          # so only commit if the index actually has something staged.
          if git diff --staged --quiet; then
            echo "No new reviews today."
          else
            if [ -n "${BACKFILL:-}" ]; then
              git commit -m "Backfill ${BACKFILL}"
            else
              git commit -m "Reviews $(date -u +%Y-%m-%d)"
            fi
            # The scheduled run may have pushed while a long backfill was
            # running, so rebase onto whatever landed rather than failing.
            git pull --rebase --autostash
            git push
          fi

      # Deliberately last, and deliberately allowed to fail the run: the day's
      # reviews are already committed and pushed above, so failing here costs
      # nothing and is the only part that reaches a person. GitHub emails on a
      # failed workflow; nobody reads a log line. A source that quietly stops
      # collecting, or starts publishing links to nowhere, is otherwise
      # invisible for weeks - which is exactly how it has gone so far.
      - name: Fail the run if anything is wrong
        run: exit ${{ steps.health.outputs.code }}
