name: Daily review sweep

on:
  schedule:
    # 07:00 UTC = 08:00 BST. GitHub cron is UTC only, so change this to
    # "0 8 * * *" if you ever want 08:00 during British WINTER time.
    # Scheduled runs sit in a queue and can start 5-20 minutes late.
    - cron: '0 7 * * *'
  workflow_dispatch:        # adds a "Run workflow" button for testing

# Needed so the job can commit the updated database back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, match and render
        run: python run.py

      - name: Commit the day's results
        run: |
          git config user.name  "fringe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.db site/ review_queue.md
          # "git commit" fails when nothing changed, which is a normal quiet day,
          # so only commit if the index actually has something staged.
          if git diff --staged --quiet; then
            echo "No new reviews today."
          else
            git commit -m "Reviews $(date -u +%Y-%m-%d)"
            git push
          fi
