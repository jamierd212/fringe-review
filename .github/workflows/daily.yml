name: Daily review sweep

on:
  schedule:
    # Twice a day, in UTC, because GitHub cron knows nothing else. Both are
    # written for BRITISH SUMMER TIME, which is when the festival happens;
    # add an hour to each if you ever want the same clock times in winter.
    #
    # Scheduled runs sit in a queue and can start 5-20 minutes late — and
    # occasionally far later: 3 August 2026 was delivered nine hours behind.
    - cron: '0 7 * * *'      # 08:00 BST — the morning board
    - cron: '0 17 * * *'     # 18:00 BST — catches the day's reviews and,
                             # more usefully, re-reads availability before
                             # anyone decides what to see tonight.

  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill one month, as YYYY-MM (e.g. 2025-08). Leave blank for a normal daily run.'
        required: false
        type: string
      limit:
        description: 'Stop after N candidates per publication. Use to rehearse a backfill cheaply.'
        required: false
        type: string

# Needed so the job can commit the updated database back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-sweep
  cancel-in-progress: false

jobs:
  # Out of season the board does not change much, but a page that stops updating
  # looks abandoned, and the sweep is what keeps the availability, the links and
  # the health checks honest. So it keeps running — once a week, on a Sunday,
  # until the 2027 festival is close enough to matter.
  #
  # The cron above still fires twice a day, because GitHub cron cannot express
  # "weekly until a date, then daily". This gate decides whether the run does
  # anything, which keeps one schedule to read rather than two to keep in step.
  # From 20 July 2027 it stops gating and the festival cadence resumes on its
  # own, with nothing to remember.
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          today=$(date -u +%Y%m%d)        # compared as a number, not a string
          weekday=$(date -u +%u)          # 7 = Sunday
          hour=$(date -u +%H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"          # asked for by hand
          elif [ "$today" -ge 20270720 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"          # festival cadence
          elif [ "$weekday" = "7" ] && [ "$hour" = "07" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"          # the weekly run
          else
            echo "run=no"  >> "$GITHUB_OUTPUT"
            echo "Out of season: the sweep runs on Sunday mornings until 20 July 2027."
          fi

  sweep:
    needs: decide
    if: needs.decide.outputs.run == 'yes'
    runs-on: ubuntu-latest
    # A daily run takes a few minutes. A month backfill is a different job: it
    # fetches a page per review at one request a second, and every show it finds
    # is new, so each one needs an admission decision. 30 minutes is not enough
    # for that, and a backfill killed halfway leaves the database half-written.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # One second, and it would have saved a day's board: Pillow was added to
      # a local virtualenv and not to requirements, so the sweep imported
      # run.py on a clean checkout and died before it fetched anything.
      - name: Check requirements cover the imports
        run: python tools/check_requirements.py

      - name: Collect, match and render
        env:
          # Used for ambiguous show matches and for admitting shows that are not
          # in any festival programme. Without it only programme-listed shows can
          # be admitted and everything else is held — which is the safe direction,
          # but on a backfill of a past festival it means almost everything, since
          # programme pages come down once the shows stop selling.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Guardian Open Platform. Without it the code falls back to their
          # public "test" key, which works but is rate-limited and will start
          # dropping requests once the festival is busy.
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          # Passed as environment rather than interpolated into the command, so
          # the value is data and cannot become part of the shell line.
          BACKFILL: ${{ inputs.backfill }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${BACKFILL:-}" ]; then
            if ! printf '%s' "$BACKFILL" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
              echo "backfill must look like YYYY-MM (got '$BACKFILL')" >&2
              exit 1
            fi
            args+=(--backfill "$BACKFILL")
          fi
          if [ -n "${LIMIT:-}" ]; then
            if ! printf '%s' "$LIMIT" | grep -Eq '^[0-9]+$'; then
              echo "limit must be a whole number (got '$LIMIT')" >&2
              exit 1
            fi
            args+=(--limit "$LIMIT")
          fi
          # ${args[@]+"${args[@]}"} is the portable empty-array idiom: nothing
          # when there are no arguments, the quoted elements when there are.
          # "${args[@]:-}" would expand to one EMPTY argument on a normal daily
          # run, and argparse rejects that outright; a bare "${args[@]}" is only
          # safe under `set -u` on bash 4.4+, which is not worth depending on.
          echo "Running: python run.py ${args[*]+${args[*]}}"
          python run.py ${args[@]+"${args[@]}"}

      # Runs before the commit so that what it records - which links have been
      # checked, and when - is committed with the day's reviews. Otherwise the
      # rotation resets every night and the same two links get checked forever.
      # The exit code is carried past the commit rather than acted on here.
      - name: Check sources and links
        id: health
        run: |
          set +e
          python run.py --health
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit the day's results
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          git config user.name  "fringe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.db docs/ review_queue.md
          # "git commit" fails when nothing changed, which is a normal quiet day,
          # so only commit if the index actually has something staged.
          if git diff --staged --quiet; then
            echo "No new reviews today."
            exit 0
          fi
          if [ -n "${BACKFILL:-}" ]; then
            git commit -m "Backfill ${BACKFILL}"
          else
            git commit -m "Reviews $(date -u +%Y-%m-%d)"
          fi
          # If the remote moved while this run was collecting, combine the two
          # rather than replaying onto them. data/reviews.db is binary, so there
          # is no diff for a rebase to replay: "pull --rebase" simply fails, and
          # with it the whole run. That is not theoretical — three consecutive
          # sweeps collected a day each, failed here, and threw all of it away,
          # which is why the ticket filter spent a week quoting a stale calendar.
          #
          # The database is an accumulating record, so the resolution is to take
          # both sides and rebuild the pages from the result.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected; merging what landed while this run collected (attempt ${attempt})"
            git fetch origin main
            git show origin/main:data/reviews.db > "${RUNNER_TEMP:-/tmp}/remote.db"
            git merge --no-commit --no-ff origin/main || true
            # Ours is this run's database and its rendered pages; the remote copy
            # is merged into the database below, and the pages are regenerated
            # from the result rather than picked between.
            git checkout --ours -- data/reviews.db docs review_queue.md || true
            python tools/merge_db.py data/reviews.db "${RUNNER_TEMP:-/tmp}/remote.db"
            python run.py --render
            git add data/reviews.db docs/ review_queue.md
            git commit -m "Merge the sweep with what landed while it ran"
          done
          echo "could not push after three attempts" >&2
          exit 1

      # Deliberately last, and deliberately allowed to fail the run: the day's
      # reviews are already committed and pushed above, so failing here costs
      # nothing and is the only part that reaches a person. GitHub emails on a
      # failed workflow; nobody reads a log line. A source that quietly stops
      # collecting, or starts publishing links to nowhere, is otherwise
      # invisible for weeks - which is exactly how it has gone so far.
      - name: Fail the run if anything is wrong
        run: exit ${{ steps.health.outputs.code }}
